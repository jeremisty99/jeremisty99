name: Update README cards

# 官方公共服务 github-readme-stats.vercel.app 因 Vercel 取消赞助频繁不可用。
# 改为用 Actions 把卡片渲染成仓库内的静态 SVG，README 直接引用本地文件。
# 原项目已停止维护，接替者为 stats-organization/GitHub Stats Extended，
# 对应的 action 使用 stats-organization/github-readme-stats-action@v2。

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'profile/**' # 卡片自身的提交不再触发，避免循环
  schedule:
    - cron: '0 0 * * *' # 每天 UTC 0 点（北京时间 8:00）更新
  workflow_dispatch:

permissions:
  contents: write # 允许工作流把生成的 SVG 推回仓库

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&locale=cn&theme=vue
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true # 拉数据失败时直接报错，不要用错误卡片覆盖正常卡片

      # 需要把私有仓库贡献也统计进去时：
      # 1) 创建一个 classic PAT，勾选 repo 和 read:user；
      # 2) 存到 Settings -> Secrets and variables -> Actions，命名为 PAT；
      # 3) 把上面的 token 改成 ${{ secrets.PAT }}，并在 options 末尾加上 &count_private=true。
      # GITHUB_TOKEN 只能读取公开数据，因此默认不开启 count_private。

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --staged --quiet && exit 0
          git commit -m "chore: update README stats card"
          git push
